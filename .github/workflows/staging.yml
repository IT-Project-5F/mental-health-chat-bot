name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, staging]

    env:
      ENVIRONMENT: staging
      NODE_ENV: staging
      DOMAIN: ${{ secrets.DOMAIN_STAGING }}
      DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE_STAGING }}
      COMPOSE_PROJECT_NAME: ${{ secrets.DOCKER_IMAGE_STAGING }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Clean workspace
        run: |
          sudo chown -R azureuser:azureuser $GITHUB_WORKSPACE || true
          sudo chmod -R 755 $GITHUB_WORKSPACE || true
          find $GITHUB_WORKSPACE -type d -name "__pycache__" -exec sudo rm -rf {} + 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Docker networks
        run: |
          docker network create proxy 2>/dev/null || true
          docker network create traefik-public 2>/dev/null || true

      - name: Stop existing services
        run: docker-compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml down || true

      - name: Clean up Docker
        run: |
          docker image prune -f || true

      - name: Build services sequentially
        run: |
          docker-compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml build --no-cache postgres
          docker-compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml build --no-cache db-init
          docker image prune -f
          docker-compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml build --no-cache server
          docker image prune -f
          docker-compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml build --no-cache client
          docker image prune -f

      - name: Start services
        run: docker-compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml up -d

      - name: Verify deployment
        run: docker-compose -p "$COMPOSE_PROJECT_NAME" ps
