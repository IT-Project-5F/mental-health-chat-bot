name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, staging]

    env:
      ENVIRONMENT: staging
      NODE_ENV: staging
      DOMAIN: ${{ secrets.DOMAIN_STAGING }}
      DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE_STAGING }}
      COMPOSE_PROJECT_NAME: ${{ secrets.DOCKER_IMAGE_STAGING }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Docker networks
        run: |
          docker network create proxy 2>/dev/null || true
          docker network create traefik-public 2>/dev/null || true

      - name: Deploy services
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.yml down || true
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.yml build --no-cache --pull
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.yml up -d --force-recreate traefik client server

      - name: Verify deployment
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" ps
