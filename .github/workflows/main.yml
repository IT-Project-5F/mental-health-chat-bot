name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on:
      - self-hosted
      - staging

    env:
      ENVIRONMENT: staging
      NODE_ENV: staging
      DOMAIN: ${{ secrets.DOMAIN_STAGING }}
      DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE_STAGING }}
      COMPOSE_PROJECT_NAME: ${{ secrets.DOCKER_IMAGE_STAGING }}
      TAG: ${{ secrets.TAG }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PORT: ${{ secrets.PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build and deploy services
        run: |
          echo "Building and deploying services..."

          # Create required networks if they don't exist
          docker network create proxy 2>/dev/null || true
          docker network create traefik-public 2>/dev/null || true

          # Stop and remove existing containers
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.yml down || true

          # Build with no cache and force rebuild
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.yml build --no-cache --pull

          # Start services
          docker compose --project-name "$COMPOSE_PROJECT_NAME" -f docker-compose.yml up -d --force-recreate

          echo "Services deployed successfully"

      - name: Wait for services to be healthy
        run: |
          timeout 300 bash -c 'until docker compose --project-name "$COMPOSE_PROJECT_NAME" ps | grep -q "healthy\|Up"; do sleep 5; done'

      - name: Verify deployment
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" ps
